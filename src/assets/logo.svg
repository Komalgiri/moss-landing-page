<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" aria-labelledby="moss-logo-title">
  <title id="moss-logo-title">MOSS</title>
  <!-- Leaf/botanical accent before text -->
  <g transform="translate(0, 4)">
    <!-- Simple elegant leaf -->
    <path d="M10 20 C10 8, 22 4, 22 4 C22 4, 22 16, 10 20Z" fill="currentColor" opacity="0.85"/>
    <path d="M10 20 C10 8, 0 6, 0 6 C0 6, 2 18, 10 20Z" fill="currentColor" opacity="0.55"/>
    <line x1="10" y1="20" x2="10" y2="6" stroke="currentColor" stroke-width="0.8" opacity="0.7"/>
  </g>
  <!-- MOSS wordmark -->
  <text
    x="30"
    y="35"
    font-family="'Playfair Display', 'Georgia', serif"
    font-size="28"
    font-weight="500"
    letter-spacing="6"
    fill="currentColor"
  >MOSS</text>
</svg>
